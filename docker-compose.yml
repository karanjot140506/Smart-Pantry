version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: smart-pantry-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-pantry-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/smartpantry
      JWT_SECRET: c21hcnQtcGFudHJ5LXN1cGVyLXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tMjAyNg==
      JWT_EXPIRATION_MS: 86400000
      CORS_ORIGINS: http://localhost:8080

volumes:
  mongo-data:
